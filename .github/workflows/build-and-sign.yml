name: Build and Release (Windows EXE + macOS PKG)

# Windows job: builds the single-file EXE with PyInstaller on GitHub-hosted
# Windows, then (optionally) Authenticode-signs it via SignPath Foundation's
# free open-source code signing, and creates the GitHub Release.
# macOS job:   builds the .app on GitHub-hosted macOS (PyInstaller cannot
# cross-compile), then packages an unsigned .pkg installer (pkgbuild) and a
# .zip (ditto), and uploads both to the release created by the Windows job.
# PyInstaller cannot cross-compile: the macOS artifacts MUST be built on macOS,
# hence this job exists instead of a local build on a Windows dev machine.
#
# SignPath setup guide: docs/windows-code-signing.md
# Trigger a release by pushing a tag, e.g.:  git tag v1.16.0 && git push origin v1.16.0
# or run this workflow manually from the Actions tab and enter a version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. v1.14.0'
        required: true
        default: 'v1.14.0'

permissions:
  contents: write   # create the GitHub release and upload the asset
  actions: read     # SignPath action reads workflow/job metadata
  id-token: write   # OIDC, used by SignPath trusted-build verification

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller and Pillow
        # Pillow 用于图片缩略图预览；缺失时程序自动降级，不影响主流程
        run: pip install "pyinstaller>=6.0" "pillow>=10.0"

      - name: Build EXE (PyInstaller --onefile --windowed)
        # 排除 numpy（Pillow 间接依赖，本工具不用，可省约 12MB）
        run: >
          pyinstaller --onefile --windowed --name WeChatFileOrganizer
          --distpath dist
          --exclude-module numpy
          --exclude-module PIL.ImageQt
          --exclude-module PIL.ImageShow
          main.py

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: WeChatFileOrganizer-unsigned
          path: dist/WeChatFileOrganizer.exe
          if-no-files-found: error

      - name: Check SignPath configuration
        id: signpath-check
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG_ID" ] && [ -n "$PROJECT" ] && [ -n "$POLICY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath configured — EXE will be Authenticode-signed"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SignPath secrets/vars missing — EXE will be released UNSIGNED. See docs/windows-code-signing.md"
          fi

      - name: Sign with SignPath
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'default' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use unsigned binary if SignPath unavailable
        if: steps.signpath-check.outputs.enabled != 'true'
        shell: cmd
        run: mkdir signed && copy dist\WeChatFileOrganizer.exe signed\

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          ASSETS="signed/WeChatFileOrganizer.exe"
          if [ -f CHANGELOG.md ]; then
            ASSETS="$ASSETS CHANGELOG.md"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created manually); skipping auto release."
            exit 0
          fi
          gh release create "$TAG" $ASSETS \
            --repo "${{ github.repository }}" \
            --title "WeChat File Organizer $TAG" \
            --notes "Automated build for Windows (EXE) and macOS (PKG/ZIP, Apple Silicon arm64). Windows EXE is Authenticode-signed via SignPath when configured, otherwise unsigned (SmartScreen warning may appear). macOS packages are unsigned: after installing the PKG, right-click the app and choose Open the first time, or clear the quarantine flag with: xattr -cr /Applications/WeChatFileOrganizer.app"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller and Pillow
        # Pillow 用于图片缩略图预览；缺失时程序自动降级，不影响主流程
        run: pip install "pyinstaller>=6.0" "pillow>=10.0"

      - name: Build .app (PyInstaller --windowed)
        # macos-latest 是 Apple Silicon (arm64)；PyInstaller 产物为 .app
        run: >
          pyinstaller --windowed --name WeChatFileOrganizer
          --distpath dist
          --exclude-module numpy
          --exclude-module PIL.ImageQt
          --exclude-module PIL.ImageShow
          main.py

      - name: Package .zip (ditto, preserves symlinks)
        run: ditto -c -k --keepParent dist/WeChatFileOrganizer.app WeChatFileOrganizer-macOS-arm64.zip

      - name: Build .pkg installer (pkgbuild, unsigned)
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: >
          pkgbuild --root dist
          --identifier com.oracis.wechat-file-organizer
          --version "${TAG#v}"
          --install-location /Applications
          WeChatFileOrganizer-macOS-arm64.pkg

      - name: Verify .app structure
        run: test -x dist/WeChatFileOrganizer.app/Contents/MacOS/WeChatFileOrganizer && ls -la dist/WeChatFileOrganizer.app/Contents/MacOS/

      - name: Upload macOS assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -e
          # Windows job 负责创建 Release；等待它就绪（最多 20 分钟）
          for i in $(seq 1 80); do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $TAG found after $((i*15))s"
              break
            fi
            sleep 15
          done
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::warning::Release $TAG not found after waiting — creating it with macOS assets only"
            gh release create "$TAG" \
              WeChatFileOrganizer-macOS-arm64.zip WeChatFileOrganizer-macOS-arm64.pkg \
              --repo "${{ github.repository }}" \
              --title "WeChat File Organizer $TAG" \
              --notes "macOS build (Apple Silicon arm64, unsigned). Right-click the app and choose Open the first time, or run: xattr -cr /Applications/WeChatFileOrganizer.app"
            exit 0
          fi
          gh release upload "$TAG" \
            WeChatFileOrganizer-macOS-arm64.zip WeChatFileOrganizer-macOS-arm64.pkg \
            --repo "${{ github.repository }}" --clobber
          echo "MACOS_ASSETS_UPLOADED"
